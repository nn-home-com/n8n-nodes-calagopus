name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Retry npm registry fetches so transient network errors (e.g. ECONNRESET) don't fail the run.
env:
  npm_config_fetch_retries: '5'
  npm_config_fetch_retry_mintimeout: '20000'
  npm_config_fetch_retry_maxtimeout: '120000'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci --ignore-scripts'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'

      - name: Run tests
        run: 'npm test'

  api-coverage:
    name: API coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci --ignore-scripts'

      - name: Run build
        run: 'npm run build'

      - name: Read supported panel version
        id: panel
        run: echo "version=$(node -p "require('./package.json').calagopus.panelVersion")" >> "$GITHUB_OUTPUT"

      - name: Check out Calagopus Panel ${{ steps.panel.outputs.version }}
        uses: actions/checkout@v7
        with:
          repository: calagopus/panel
          ref: release-${{ steps.panel.outputs.version }}
          path: .panel
          sparse-checkout: backend/src/routes

      # Fails if an operation points to a route that does not exist in the supported panel version.
      - name: Compare operations with panel routes
        run: 'npm run api:coverage -- .panel'
